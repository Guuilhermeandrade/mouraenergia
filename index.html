<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="layout-sistema">

<aside class="sidebar">

<div class="conteudo-sistema">

<div class="container">

<header class="topo topo-sistema">

    <div class="topo-info">

        <div class="badge">
            ⚡ FORMATADOR AUTOMÁTICO DE MÁSCARA PADRÃO ⚡
        </div>

        
        <p class="subtitulo">
            Cole o chamado bruto abaixo e gere automaticamente no padrão corporativo.
        </p>

    </div>

    <div class="topo-logo">
        <img src="assets/img/wesafer.png" alt="WE SAFER">
    </div>

</header>

<div class="area">

<textarea id="entrada" placeholder="Cole aqui o texto do chamado..."></textarea>

<div class="botoes">
    <button onclick="formatar()">FORMATAR</button>
    <button class="btn-copiar" onclick="copiarResultado()">COPIAR TEXTO</button>
    <button class="btn-limpar" onclick="limparTudo()">LIMPAR</button>
</div>

<div id="blocoResultado" style="display:none;">
    <textarea id="saida" readonly></textarea>
</div>

</div>

<div class="footer">WeSafer Produtos Digitais Ltda.</div>

</div>

</div>
</div>

<script>
function pegar(regex,texto){
    const match = texto.match(regex)
    return match ? match[1].trim() : ""
}

function formatarData(data){
    if(!data) return ""
    const partes = data.split("-")
    return `${partes[2]}/${partes[1]}`
}

function ajustarSite(site){
    if(!site) return ""
    site = site.trim()

    if(site.includes("_")){
        const [sigla,estado] = site.split("_")
        return `${estado}${sigla}`.replace(/[^A-Z0-9]/gi,"")
    }

    if(site.includes("-")){
        const partes = site.split("-")
        if(partes.length === 2){
            return `${partes[1]}${partes[0]}`.replace(/[^A-Z0-9]/gi,"")
        }
    }

    return site.replace(/[^A-Z0-9]/gi,"")
}

function formatar(){
    const texto = document.getElementById("entrada").value

    const ticket = pegar(/\((\d+)\)/,texto)
    const tecnico = pegar(/ome completo\s+([^\n]+)/i,texto).toUpperCase()
    const supervisor = pegar(/Supervisor\s+([^\n]+)/i,texto).toUpperCase()
    const empresa = pegar(/Empresa Solicitante\s+Empresa Solicitante\s+([^\n]+)/i,texto).toUpperCase()
    const siteOriginal = pegar(/Site a ser Acessado\s+([^\n]+)/i,texto)
    const siteAjustado = ajustarSite(siteOriginal)

    const dataInicial = formatarData(pegar(/data inicial\s+(\d{4}-\d{2}-\d{2})/i,texto))
    const dataFinal = formatarData(pegar(/data final\s+(\d{4}-\d{2}-\d{2})/i,texto))
    const periodo = `${dataInicial} À ${dataFinal}`

    let acao = ""
    const linhas = texto.split("\n")
    const indice = linhas.findIndex(l => l.toLowerCase().includes("ação a ser realizada"))

    if(indice !== -1 && linhas[indice + 1]){
        acao = linhas[indice + 1].trim()
    }

    acao = acao.toUpperCase()

    if(!acao.endsWith(".")){
        acao += "."
    }

    const portaOperadora = texto.toLowerCase().includes("porta operadora")
    const implantacao = texto.toLowerCase().includes("implantação")
    const operacao = texto.toLowerCase().includes("operação")

    const resultado =
`TÉCNICO: ${tecnico} - ${siteAjustado}: ${ticket} ${periodo}

Site: ${siteOriginal}
Solicitante: ${supervisor}
Técnico: ${tecnico}
Empresa: ${empresa}
Período: ${periodo}
Porta Moura (${portaOperadora ? " " : "X"}) Operadora (${portaOperadora ? "X" : " "})
Implantação (${implantacao ? "X" : " "}) Operação (${operacao ? "X" : " "})

---

ENTRADA 🔓
SITE: ${siteOriginal}
TICKET: ${ticket}
TÉCNICO: ${tecnico}
AÇÃO: ${acao}

SAÍDA 🔒
SITE: ${siteOriginal}
TICKET: ${ticket}
TÉCNICO: ${tecnico}
AÇÃO: ${acao}`

    document.getElementById("saida").value = resultado
    document.getElementById("blocoResultado").style.display = "block"
}

function copiarResultado(){
    const saida = document.getElementById("saida")
    navigator.clipboard.writeText(saida.value)
    alert("TEXTO COPIADO!")
}

function limparTudo(){
    document.getElementById("entrada").value = ""
    document.getElementById("saida").value = ""
    document.getElementById("blocoResultado").style.display = "none"
}
</script>

</body>
</html>
