    cursor:pointer;
    text-align:left;
    transition:0.25s;
    box-shadow:0 15px 30px rgba(0,0,0,0.18);
}

.resumo-card:hover,
.resumo-card.ativo-card{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 22px 45px rgba(37,99,235,0.35);
    outline:2px solid rgba(255,255,255,0.45);

.resumo-card span{

.resumo-card strong{

}

.card-total{background:linear-gradient(135deg,#2563eb,#0ea5e9);}
.card-ativos{background:linear-gradient(135deg,#16a34a,#22c55e);}
.card-expirados{background:linear-gradient(135deg,#dc2626,#ef4444);}
.card-aguardando{background:linear-gradient(135deg,#ca8a04,#eab308);}

    background:linear-gradient(180deg,#eff6ff,#dbeafe);

    overflow:auto;
    box-shadow:
    inset 0 0 0 1px rgba(59,130,246,0.18),

}

.topo-lista-card{
    display:flex;
    justify-content:space-between;
    gap:16px;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.topo-lista-card h2{
    font-size:20px;
    color:#0f172a;
}

.btn-copiar-lista{
    background:linear-gradient(135deg,#16a34a,#22c55e)!important;
    box-shadow:0 15px 30px rgba(22,163,74,0.28)!important;
}

.area-copiavel .resumo-cards{
    display:none;
}

@media(max-width:1000px){
    .resumo-cards{

    }
}

    .resumo-cards{
        grid-template-columns:1fr;
    }

    .topo-lista-card{
        align-items:stretch;
    }

    .topo-lista-card button{
        width:100%;
    }
}

/* AJUSTE VISUAL - CARDS MAIS DISCRETOS */
.resumo-cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
    margin-bottom:20px;
}

.resumo-card{
    border:none;
    border-radius:16px;
    padding:14px 16px;
    color:#e2e8f0;
    cursor:pointer;
    text-align:left;
    transition:0.25s;
    box-shadow:0 10px 22px rgba(0,0,0,0.18);
    border:1px solid rgba(255,255,255,0.08);
}

.resumo-card:hover,
.resumo-card.ativo-card{
    transform:translateY(-2px);
    box-shadow:0 14px 28px rgba(37,99,235,0.24);
    outline:none;
    border-color:rgba(147,197,253,0.35);
}

.resumo-card span{
    display:block;
    font-size:11px;
    font-weight:800;
    letter-spacing:0.8px;
    color:#cbd5e1;
    margin-bottom:4px;
}

.resumo-card strong{
    display:block;
    font-size:24px;
    font-weight:900;
    color:white;
}

.card-total{
    background:linear-gradient(135deg,rgba(37,99,235,0.88),rgba(14,165,233,0.88));
}

.card-ativos{
    background:linear-gradient(135deg,rgba(22,163,74,0.88),rgba(34,197,94,0.88));
}

.card-expirados{
    background:linear-gradient(135deg,rgba(220,38,38,0.88),rgba(239,68,68,0.88));
}

.card-aguardando{
    background:linear-gradient(135deg,rgba(202,138,4,0.88),rgba(234,179,8,0.88));
}


.data-wrapper{
    width:100%;
    cursor:pointer;
    border-radius:18px;
    transition:.2s;
}

.data-wrapper:hover{
    transform:translateY(-1px);
}

.data-wrapper input{
    width:100%;
    cursor:pointer;
}

/* Faz a área inteira do campo de data abrir o calendário no Chrome/Edge */
#dataReferencia::-webkit-calendar-picker-indicator{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    cursor:pointer;
    opacity:0;
}

<body>

<div class="layout-sistema">

<aside class="sidebar">

        <img src="assets/img/wesafer.png" alt="WE SAFER">
    </div>

<div class="conteudo-sistema">

<div class="container">

<header class="topo">
    <div class="badge">📊 CLASSIFICADOR AUTOMÁTICO - ATIVOS & EXPIRADOS</div>

    <div class="logo">
        <img src="assets/img/wesafer.png" alt="WE SAFER">
    </div>

    <p class="subtitulo">
        Cole a lista bruta abaixo e gere automaticamente os ATIVOS e EXPIRADOS organizados em tabela padrão Teams.
    </p>
</header>

<main class="area">

<section class="config">
    <div class="campo">
        <label for="dataReferencia">DATA DE REFERÊNCIA</label>
        <div class="data-wrapper" onclick="abrirCalendario()">
            <input type="date" id="dataReferencia">
        </div>
    </div>
</section>

<textarea id="entrada" placeholder="Cole aqui sua lista bruta..."></textarea>

<div id="resultado" class="resultado"></div>

<div class="botoes">
    <button onclick="gerar()">GERAR TABELAS</button>
    <button class="btn-copiar" onclick="copiarTabelaTeams()">COPIAR PARA TEAMS</button>
    <button class="btn-limpar" onclick="limparTudo()">LIMPAR</button>
</div>

</main>

<footer class="footer">WeSafer Produtos Digitais Ltda.</footer>

</div>

</div>
</div>

<script>
let dadosClassificador = {
    teams: [],
    ativos: [],
    expirados: [],
    aguardando: [],
    dataFormatada: ""
}

function parseData(data){
    const anoAtual = new Date().getFullYear()
    const [dia,mes] = data.split("/")
    return new Date(anoAtual, mes - 1, dia)
}

function formatarNome(nome){
    nome = nome.replace(/\((.*?)\)/g,"<strong><em>($1)</em></strong>")
    nome = nome.replace(/AGUARDANDO LIBERAÇÃO/g,"<strong><em>AGUARDANDO LIBERAÇÃO</em></strong>")
    return nome
}

function gerar(){
    const texto = document.getElementById("entrada").value.trim()
    const dataRefInput = document.getElementById("dataReferencia").value

    if(!texto || !dataRefInput){
        alert("Preencha a data e cole a lista.")
        return
    }

    const dataRef = new Date(dataRefInput + "T00:00:00")
    const linhas = texto.split("\n").filter(linha => linha.trim() !== "")

    let ativos = []
    let expirados = []
    let aguardando = []

    // Listas usadas apenas na aba TEAMS.
    // Aqui os itens aguardando liberação entram em ATIVOS ou EXPIRADOS pela data.
    let ativosTeams = []
    let expiradosTeams = []

    linhas.forEach(linha => {
        let nome, site, chamado, inicio, fim

        if(linha.includes(" - ") && linha.includes(":")){
            const partes = linha.split(" - ")
            nome = partes[0].trim()

            const resto = partes[1].split(":")
            site = resto[0].trim()

            const dados = resto[1].trim().split(" ")
            chamado = parseInt(dados[0])
            inicio = dados[1]
            fim = dados[3]
        }else{
            const partes = linha.split(/\s+/)
            nome = partes.slice(0, partes.length - 4).join(" ")
            chamado = parseInt(partes[partes.length - 4])
            site = partes[partes.length - 3]
            inicio = partes[partes.length - 2]
            fim = partes[partes.length - 1]
        }

        const dataFim = parseData(fim)

        const item = {
            nome,
            site,
            chamado,
            periodo:`${inicio} À ${fim}`
        }

        const ehAguardando =
        nome.toUpperCase().includes("AGUARDANDO LIBERAÇÃO")

        // Classificação da aba TEAMS: aguardando também entra em ativos/expirados conforme a data.
        if(dataFim <= dataRef){
            expiradosTeams.push(item)
        }else{
            ativosTeams.push(item)
        }

        // Classificação dos cards individuais: aguardando fica separado.
        if(ehAguardando){
            aguardando.push(item)
        }else if(dataFim <= dataRef){
            expirados.push(item)
        }else{
            ativos.push(item)
        }
    })

    ativos.sort((a,b)=>a.chamado-b.chamado)
    expirados.sort((a,b)=>a.chamado-b.chamado)
    aguardando.sort((a,b)=>a.chamado-b.chamado)
    ativosTeams.sort((a,b)=>a.chamado-b.chamado)
    expiradosTeams.sort((a,b)=>a.chamado-b.chamado)

    const [ano, mes, dia] = dataRefInput.split("-")
    const dataFormatada = `${dia}/${mes}/${ano}`

    dadosClassificador = {
        teams: [...ativosTeams, ...expiradosTeams],
        ativos,
        expirados,
        aguardando,
        ativosTeams,
        expiradosTeams,
        total: linhas.length,
        dataFormatada
    }

    montarResultado()
    mostrarLista("teams")
}

function montarCards(){
    return `
    <div class="resumo-cards nao-copiar">
        <div class="resumo-card card-total" id="card-teams" onclick="mostrarLista('teams')">
            <span>TEAMS</span>
            <strong>${dadosClassificador.total}</strong>
        </div>

        <div class="resumo-card card-ativos" id="card-ativos" onclick="mostrarLista('ativos')">
            <span>ATIVOS</span>
            <strong>${dadosClassificador.ativos.length}</strong>
        </div>

        <div class="resumo-card card-expirados" id="card-expirados" onclick="mostrarLista('expirados')">
            <span>EXPIRADOS</span>
            <strong>${dadosClassificador.expirados.length}</strong>
        </div>

        <div class="resumo-card card-aguardando" id="card-aguardando" onclick="mostrarLista('aguardando')">
            <span>AGUARDANDO LIBERAÇÃO</span>
            <strong>${dadosClassificador.aguardando.length}</strong>
        </div>
    </div>
    `
}

function montarResultado(){
    document.getElementById("resultado").innerHTML = `
        ${montarCards()}
        <div id="areaListaCard" class="area-lista-card"></div>
    `
}

function criarTabela(lista,tipo){
    if(lista.length === 0){
        return `<p>Nenhum registro.</p>`
    }

    return `
    <div class="bloco ${tipo}">
        <h2>${tipo === "ativos" ? "🟢 ATIVOS" : tipo === "expirados" ? "🔴 EXPIRADOS" : tipo === "aguardando" ? "🟡 AGUARDANDO LIBERAÇÃO" : "📋 LISTA TEAMS"}</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome do Técnico</th>
                    <th>Nº do Chamado</th>
                    <th>Site</th>
                    <th>Período</th>
                </tr>
            </thead>
            <tbody>
                ${lista.map(item => `
                <tr>
                    <td>${formatarNome(item.nome)}</td>
                    <td>${item.chamado}</td>
                    <td>${item.site}</td>
                    <td>${item.periodo}</td>
                </tr>
                `).join("")}
            </tbody>
        </table>
    </div>
    `
}

function criarConteudoTeams(){
    return `
    <div class="area-copiavel" id="conteudoCopiavel">
        <div style="margin-bottom:25px;font-weight:700;font-size:15px;line-height:1.7;">
            Boa noite,<br><br>
            SEGUE A LISTA ATUALIZADA DE ACESSOS AUTORIZADOS - ${dadosClassificador.dataFormatada}
        </div>
        ${criarTabela(dadosClassificador.ativosTeams,"ativos")}
        ${criarTabela(dadosClassificador.expiradosTeams,"expirados")}
    </div>
    `
}

function criarConteudoSimples(tipo){
    return `
    <div class="area-copiavel" id="conteudoCopiavel">
        ${criarTabela(dadosClassificador[tipo],tipo)}
    </div>
    `
}

function mostrarLista(tipo){
    document.querySelectorAll(".resumo-card").forEach(card => {
        card.classList.remove("ativo-card")
    })

    const cardSelecionado = document.getElementById(`card-${tipo}`)
    if(cardSelecionado){
        cardSelecionado.classList.add("ativo-card")
    }

    const area = document.getElementById("areaListaCard")

    let titulo = ""
    let conteudo = ""

    if(tipo === "teams"){
        titulo = `📋 TEAMS (${dadosClassificador.total})`
        conteudo = criarConteudoTeams()
    }

    if(tipo === "ativos"){
        titulo = `🟢 ATIVOS (${dadosClassificador.ativos.length})`
        conteudo = criarConteudoSimples("ativos")
    }

    if(tipo === "expirados"){
        titulo = `🔴 EXPIRADOS (${dadosClassificador.expirados.length})`
        conteudo = criarConteudoSimples("expirados")
    }

    if(tipo === "aguardando"){
        titulo = `🟡 AGUARDANDO LIBERAÇÃO (${dadosClassificador.aguardando.length})`
        conteudo = criarConteudoSimples("aguardando")
    }

    area.innerHTML = `
    <div class="topo-lista-card nao-copiar">
        <h2>${titulo}</h2>
        <button class="btn-copiar-lista" onclick="copiarListaAtual()">COPIAR LISTA</button>
    </div>
    ${conteudo}
    `
}

function copiarListaAtual(){
    const conteudo = document.getElementById("conteudoCopiavel")

    if(!conteudo){
        alert("Gere uma lista primeiro.")
        return
    }

    copiarElemento(conteudo)
}

function copiarTabelaTeams(){
    mostrarLista("teams")
    const conteudo = document.getElementById("conteudoCopiavel")

    if(!conteudo){
        alert("Gere uma lista primeiro.")
        return
    }

    copiarElemento(conteudo)
}

function copiarElemento(elemento){
    const clone = elemento.cloneNode(true)

    clone.querySelectorAll(".nao-copiar").forEach(item => {
        item.remove()
    })

    const areaTemporaria = document.createElement("div")
    areaTemporaria.style.position = "fixed"
    areaTemporaria.style.left = "-9999px"
    areaTemporaria.appendChild(clone)

    document.body.appendChild(areaTemporaria)

    const range = document.createRange()
    range.selectNode(clone)

    const selection = window.getSelection()
    selection.removeAllRanges()
    selection.addRange(range)

    document.execCommand("copy")

    selection.removeAllRanges()
    document.body.removeChild(areaTemporaria)

    alert("LISTA COPIADA!")
}

function abrirCalendario(){
    const campo = document.getElementById("dataReferencia")
    campo.focus()

    if(campo.showPicker){
        campo.showPicker()
    }
}

function limparTudo(){
    document.getElementById("entrada").value = ""
    document.getElementById("resultado").innerHTML = ""
    document.getElementById("dataReferencia").value = ""
}
</script>
